# Generated from xynes-infra scripts/setup/ci-quality-profiles.json.
name: "Required quality gates"
"on":
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release/*"
  push:
    branches:
      - "main"
      - "develop"
      - "release/*"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "quality-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  gates:
    name: "${{ matrix.gate }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate:
          - "lint"
          - "test"
          - "coverage"
          - "typecheck"
          - "build"
    env:
      GATE_NAME: "${{ matrix.gate }}"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
      -
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "22.22.0"
      -
        uses: "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1"
        with:
          version: "10.33.0"
      -
        run: "pnpm install --frozen-lockfile"
      -
        run: |
          case "$GATE_NAME" in
            lint)
              pnpm lint
              ;;
            test)
              pnpm test
              ;;
            coverage)
              pnpm test:coverage
              ;;
            typecheck)
              pnpm typecheck
              ;;
            build)
              pnpm build
              ;;
            *) exit 2 ;;
          esac
